[tox]
requires = tox-uv>=1
envlist = py312-django{42,52}, quality

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands = pytest {posargs}

[pycodestyle]
max-line-length = 120
exclude = .git,.tox

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pylint src/acid
    pycodestyle src/acid
