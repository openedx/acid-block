[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "acid-xblock"
description = "Acid XBlock Test"
readme = "README.md"
license = "AGPL-3.0"
license-files = ["LICENSE.TXT"]
authors = [{name = "Open edX Project", email = "oscm@openedx.org"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "XBlock",
    "Mako",
    "lazy",
]

[project.urls]
Homepage = "https://github.com/openedx/acid-block"

[project.entry-points."xblock.v1"]
acid = "acid:AcidBlock"
acid_parent = "acid:AcidParentBlock"

[project.entry-points."xblock_asides.v1"]
acid_aside = "acid:AcidAside"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
# Dummy version for when .git isn't accessible (e.g. Docker bind-mount builds)
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acid = ["static/**/*", "public/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.coverage.run]
branch = true
source_pkgs = ["acid"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*", "*/settings.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
test-base = [
    "pytest",
    "pytest-cov",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<5.0",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
quality = [
    "edx-lint",
    "pycodestyle",
    {include-group = "test"},
]
ci = [
    "tox",
    "tox-uv>=1",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
]


[tool.edx_lint]
uv_constraints = []

[tool.uv]
package = true
# Every `uv sync`/`uv run` invocation in this repo names an explicit --group.
# Without this, uv's implicit default group (named "dev") would be synced *in
# addition* to whatever --group is passed, defeating the point of having
# separate groups.
default-groups = []
# constraint-dependencies is machine-managed by edx_lint write_uv_constraints — do not edit directly
constraint-dependencies = []
conflicts = [
    [
        {group = "django42"},
        {group = "test"},
    ],
]


[tool.pylint.format]
max-line-length = 120

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
